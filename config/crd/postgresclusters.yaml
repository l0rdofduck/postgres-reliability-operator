apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresclusters.db.example.com
spec:
  group: db.example.com
  names:
    kind: PostgresCluster
    listKind: PostgresClusterList
    plural: postgresclusters
    singular: postgrescluster
    shortNames:
      - pgc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Leader
          type: string
          jsonPath: .status.leader
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                image:
                  type: string
                  default: pgc/postgres-patroni:16
                storageSize:
                  type: string
                  default: 1Gi
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                patroni:
                  type: object
                  properties:
                    ttl:
                      type: integer
                      minimum: 10
                      default: 20
                    loopWait:
                      type: integer
                      minimum: 1
                      default: 10
                    retryTimeout:
                      type: integer
                      minimum: 1
                      default: 10
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                leader:
                  type: string
                replicas:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      role:
                        type: string
                      state:
                        type: string
                      lagBytes:
                        type: integer
                        format: int64
                    required:
                      - name
                      - role
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
